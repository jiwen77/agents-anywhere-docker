name: Build Agents Anywhere Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream official release tag
        required: true
        default: v2.0.3
  schedule:
    - cron: '17 5 * * *' # UTC: check the latest official release daily

permissions:
  contents: read
  packages: write

concurrency:
  group: agents-anywhere-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve official release tag and image name
        id: vars
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh api repos/anywhere-labs/Agents-Anywhere/releases/latest --jq '.tag_name')"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unsupported release tag: $tag"
            exit 1
          fi
          owner_lower="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner_lower/agents-anywhere-server" >> "$GITHUB_OUTPUT"
          echo "Building upstream $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip versions already published
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Image already exists: $IMAGE:$TAG"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            echo "Image not found, will build: $IMAGE:$TAG"
          fi

      - name: Check out upstream source at official release tag
        if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: anywhere-labs/Agents-Anywhere
          ref: ${{ steps.vars.outputs.tag }}
          path: source
          persist-credentials: false

      - name: Build and push server image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/docker/Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Agents Anywhere server from upstream release
          cache-from: type=gha
          cache-to: type=gha,mode=min
